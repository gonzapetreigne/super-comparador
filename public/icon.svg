<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Shopping cart icon -->
  <g fill="none" stroke="url(#cartGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" transform="translate(48, 48)">
    <circle cx="150" cy="350" r="28" fill="#ffffff" />
    <circle cx="310" cy="350" r="28" fill="#ffffff" />
    <path d="M40 70 h60 l45 190 h195 l40 -140 h-255" />
    <path d="M190 190 v-60 m-30 30 h60" stroke="#10b981" stroke-width="22" stroke-linecap="round" />
  </g>
  
  <!-- Percentage savings tag badge -->
  <g transform="translate(320, 70)">
    <circle cx="45" cy="45" r="55" fill="#ef4444" stroke="#ffffff" stroke-width="10" />
    <text x="45" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">%</text>
  </g>
</svg>
